<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Longway · games for two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, tender — two people far apart sharing a game night
   IDEA: a pocket game box passed between two phones
   PICTURE: the live game board itself, big, in a soft rounded housing
   COLOUR and TYPE: peach ground, coral (player 1) + periwinkle (player 2), ink plum; Fredoka + Nunito
   LAYOUT: one centered phone-width column, header, together card, score, game grid / board */
:root{color-scheme:light dark;
--bg:light-dark(#fff6ef,#1d1622);--card:light-dark(#ffffff,#2a2131);--ink:light-dark(#2b1d33,#f6ecf4);--mute:light-dark(#7d6c84,#b6a5bb);
--line:light-dark(#f1e2d8,#3a2f42);--p1:#ff6b6b;--p1s:light-dark(#ffe3e0,#4a2630);--p2:#6c7cff;--p2s:light-dark(#e3e6ff,#272d55);--sun:light-dark(#ffd36e,#e0b24a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{font:600 26px/1 Fredoka,sans-serif;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo svg{width:34px;height:22px}
.pill{margin-left:auto;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb}.dot.on{background:#3ccf7a;box-shadow:0 0 0 3px #3ccf7a33}
h1{font:600 clamp(30px,8vw,40px)/1.05 Fredoka,sans-serif;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 6px 20px #8a4b5a14}
.duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:600 26px Fredoka;color:#fff;position:relative}
.av.p1{background:linear-gradient(145deg,#ff9a8b,var(--p1))}.av.p2{background:linear-gradient(145deg,#9aa6ff,var(--p2))}
.av.off{filter:grayscale(.85);opacity:.55}
.av i{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--card);background:#3ccf7a}
.av.off i{display:none}
.nm{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font:600 34px/1 Fredoka}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.heart{width:56px;height:56px;border-radius:50%;background:var(--p1s);display:grid;place-items:center;transition:transform .15s}
.heart:active{transform:scale(.88)}.heart svg{width:28px}
.note{font-size:14px;color:var(--mute);margin:12px 0 0;text-align:center}
h2{font:600 22px Fredoka;margin:26px 0 12px;display:flex;align-items:center}
h2 small{margin-left:auto;font:700 13px Nunito;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border-radius:22px;padding:16px 14px 14px;text-align:left;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}.tile svg{width:48px;height:48px}
.tile b{font:600 18px Fredoka;display:block}.tile span{font-size:13px;color:var(--mute)}
.t1{background:var(--p1s)}.t2{background:var(--p2s)}.t3{background:light-dark(#fff1cf,#3d3220)}.t4{background:light-dark(#dcf6ea,#1f3a30)}.t5{background:light-dark(#f4e3ff,#36264a)}
.bar{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.back{height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800}
.bar h2{margin:0}
.turn{font-weight:800;text-align:center;margin:0 0 12px;min-height:24px}
.turn.p1{color:var(--p1)}.turn.p2{color:var(--p2)}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.ttt button{aspect-ratio:1;border-radius:20px;background:var(--bg);border:2px solid var(--line);font:600 clamp(40px,14vw,64px)/1 Fredoka}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--p2);padding:10px;border-radius:20px;max-width:440px;margin:0 auto}
.c4 button{aspect-ratio:1;border-radius:50%;background:var(--bg)}
.c4 .a{background:var(--p1)}.c4 .b{background:var(--sun)}
.x{color:var(--p1)}.o{color:var(--p2)}
.btn{height:48px;padding:0 20px;border-radius:99px;font-weight:800;background:var(--ink);color:var(--bg)}
.btn.soft{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.fig{position:relative;aspect-ratio:1;border-radius:20px;background:#fff;border:2px solid var(--line);overflow:hidden;touch-action:none}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.word{text-align:center;font:600 26px Fredoka;margin:0 0 10px}
.pens{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.pens button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}.pens button.on{border-color:var(--ink)}
form{display:flex;gap:8px;margin-top:12px}
input{flex:1;height:48px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 18px;font:16px Nunito}
.gl{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}.gl li{padding:4px 12px;border-radius:99px;font-size:14px;background:var(--bg)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tot button{min-height:130px;border-radius:22px;font:600 22px Fredoka;background:var(--bg);border:2px solid var(--line);padding:12px;position:relative}
.tot button.me{border-color:var(--ink)}
.tags{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.tags em{font:800 12px Nunito;font-style:normal;color:#fff;padding:2px 10px;border-radius:99px}
.big{text-align:center;font:600 22px/1.3 Fredoka;padding:28px 18px;border-radius:22px;background:var(--bg);min-height:150px;display:grid;place-items:center;text-wrap:balance}
.kind{font:800 13px Nunito;color:var(--mute);display:block;margin-bottom:6px}
.fly{position:fixed;pointer-events:none;width:44px;bottom:30px;animation:up 2.2s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-70vh) scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){.fly{animation-duration:.01s}.tile,.heart{transition:none}}
@media(max-width:380px){.av{width:52px;height:52px}.tile{min-height:120px}}
.lbl{display:block;font-weight:800;font-size:14px;margin:0 0 6px}
#nm{width:100%}
.wide{flex:1}
.or{text-align:center;color:var(--mute);font-size:14px;margin:18px 0 0}
.warn{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:var(--p1s);font-size:14px;font-weight:700}
.code{font:600 clamp(40px,12vw,56px)/1 Fredoka;letter-spacing:6px;text-align:center;color:var(--p2);margin:4px 0 12px}
.linkbox{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;overflow-wrap:anywhere;text-align:center;user-select:all}
.t6{background:light-dark(#fff3d6,#3d3220)}.t7{background:light-dark(#dff2e8,#1f3a30)}.t8{background:light-dark(#dcf1e2,#203a2a)}
.p1c{color:var(--p1)}.p2c{color:var(--p2)}.p1b{background:var(--p1)}.p2b{background:var(--p2)}
.whtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.whscore{text-align:center}.whscore span{font:600 26px/1 Fredoka;display:block}.whscore small{color:var(--mute);font-size:13px}
.whtime{font:600 34px/1 Fredoka;padding:8px 18px;border-radius:16px;background:var(--bg)}
.whword{text-align:center;font:600 24px/1.3 Fredoka;min-height:34px;margin:4px 0 8px;letter-spacing:2px}
.whword.ok{color:#2fb67c}.whword.bad{color:var(--p1)}.whword.dup{color:var(--mute)}
.whgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.whgrid.dim{opacity:.45}
.wt{aspect-ratio:1;border-radius:16px;background:light-dark(#fff1cf,#3d3220);border:2px solid light-dark(#f0d48a,#5c4a28);display:grid;place-items:center;font:600 clamp(28px,9vw,40px)/1 Fredoka;color:light-dark(#6b4500,#ffe2a0)}
.wt.on{background:#2fb67c;border-color:#24935f;color:#fff}
.whcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.whcol div{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.whcol span{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--bg)}
.plwrap{border-radius:14px;overflow:hidden}#plc{display:block;width:100%;aspect-ratio:1060/560;touch-action:none}
.plinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.pbpair{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;background:#dcf1e2;border:3px solid #b9dec4;border-radius:10px;padding:10px}
.pbcell{aspect-ratio:1;background:#c9e4d1;border-radius:4px;overflow:hidden;position:relative;display:grid;place-items:center}
.pbcell video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.pbcell img{width:100%;height:100%;object-fit:cover}.pbcell img.pblive{image-rendering:auto}
.pbph{padding:12px;text-align:center;font-size:13px;color:#2b4a36;font-weight:700}
.pblab{position:absolute;left:6px;bottom:6px;color:#fff;font:800 12px Nunito;padding:2px 9px;border-radius:99px}
.pbcount{position:absolute;inset:0;display:grid;place-items:center;font:600 96px Fredoka;color:#fff;text-shadow:0 4px 20px #0006;pointer-events:none;opacity:0}
.pbcount.show{opacity:1}.pbcount.flash{opacity:1;background:#fff;animation:fl .7s forwards}@keyframes fl{to{opacity:0}}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.seg button{height:48px;padding:0 16px;font-weight:800}.seg button.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5}a.btn{display:inline-flex;align-items:center;text-decoration:none}
.strip{margin:18px auto 0;text-align:center}.strip img{width:100%;max-width:340px;display:block;margin:0 auto 10px;box-shadow:0 8px 24px #0002}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><svg viewBox="0 0 34 22"><circle cx="11" cy="11" r="10" fill="#ff6b6b"/><circle cx="23" cy="11" r="10" fill="#6c7cff" opacity=".85"/></svg>longway</div>
  <div class="pill" id="pill"><span class="dot" id="cdot"></span><span id="ctext">Connecting…</span></div>
</header>
<main id="app"></main>
</div>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WORDS=['airplane','beach','pizza','cat','rainbow','guitar','rocket','moon','sunflower','castle','snowman','octopus','bicycle','cupcake','dragon','lighthouse','umbrella','volcano','penguin','tent','robot','whale','campfire','ice cream','train','crown','cactus','mermaid','popcorn','telescope'];
const TOT=[['Beach','Mountains'],['Coffee','Tea'],['Morning','Night'],['Movie night','Game night'],['Call','Text'],['Sweet','Salty'],['Cats','Dogs'],['Road trip','Flight'],['Pizza','Tacos'],['Summer','Winter'],['Stay in','Go out'],['Books','Movies'],['City','Countryside'],['Sunrise','Sunset'],['Plan it','Wing it'],['Pancakes','Waffles'],['Rain','Snow'],['Museum','Theme park'],['Hug','Kiss'],['Breakfast in bed','Dinner out']];
const TRUTH=['What was your first impression of me?','What is a song that reminds you of us?','What is something you have never told me?','When did you miss me the most this week?','What is your favorite memory of us?','What is one thing you want us to do next time we see each other?','What habit of mine secretly makes you smile?','What is the most embarrassing thing on your phone?','What made you laugh the hardest this month?','If we could teleport anywhere tonight, where would we go?','What is your guilty-pleasure show?','What is something small I do that means a lot to you?'];
const DARE=['Send me the last photo in your camera roll.','Sing the chorus of any song for 10 seconds.','Do your best impression of me.','Show me the view out your window right now.','Text me a poem you make up in 60 seconds.','Talk in an accent until your next turn.','Show me the weirdest thing within arm’s reach.','Do 10 jumping jacks while we watch.','Draw me in 30 seconds and hold it up.','Send me a voice note saying something sweet.','Change your phone wallpaper to a photo of us for a day.','Tell me a joke. If I don’t laugh, do another dare.'];
const PENS=['#2b1d33','#ff6b6b','#6c7cff','#2fb67c','#ffb020','#ffffff'];
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ---- connection state ----
let code='',role=null,mySeatN=0,linked=false,lobbyMsg='',myName=LS.get('lw-name')||'',theirName='';
const fresh=()=>({v:0,w:'',game:null,score:[0,0],ties:0,
  ttt:{b:'.........',t:0,st:0,win:null},c4:{b:'.'.repeat(42),t:0,st:0,win:null},
  dg:{d:0,word:WORDS[Math.floor(Math.random()*WORDS.length)],solved:false,gs:[],clr:0},
  tot:{i:0,p:[null,null],m:0,n:0},td:{t:0,k:'',c:-1},wh:{r:0,b:'',dur:80,done:0},pl:null,pb:{sess:0,n:3}});
let S=fresh();
const save=()=>{if(code)LS.set('lw-s-'+code,JSON.stringify(S))};
const loadS=()=>{try{const L=JSON.parse(LS.get('lw-s-'+code)||'null');if(L&&typeof L.v==='number')S=Object.assign(fresh(),L)}catch(e){}};

const mySeat=()=>mySeatN;
const duo=()=>linked;
const canAct=seat=>linked&&mySeatN===seat;
const name=i=>i===mySeatN?'You':(theirName||'Partner');
const pts=i=>S.score[i]||0;
const here=i=>i===mySeatN||linked;
function point(i){if(i===null){S.ties++;return}S.score[i]=(S.score[i]||0)+1}
function commit(){S.v++;S.w=role;save();render();shareState()}

// ---- games ----
const L3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttPlay(c){const g=S.ttt;if(g.win!==null||g.b[c]!=='.'||!canAct(g.t))return;
  const m=g.t?'O':'X';g.b=g.b.slice(0,c)+m+g.b.slice(c+1);
  if(L3.some(l=>l.every(j=>g.b[j]===m))){g.win=g.t;point(g.t)}else if(!g.b.includes('.')){g.win=-1;point(null)}else g.t=1-g.t;commit()}
function tttNew(){const g=S.ttt;g.st=1-g.st;Object.assign(g,{b:'.........',t:g.st,win:null});commit()}
function c4Win(b,r,c,m){const at=(r,c)=>r>=0&&r<6&&c>=0&&c<7&&b[r*7+c]===m;
  return [[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(let k=1;at(r+dr*k,c+dc*k);k++)n++;for(let k=1;at(r-dr*k,c-dc*k);k++)n++;return n>=4})}
function c4Play(c){const g=S.c4;if(g.win!==null||!canAct(g.t))return;let r=5;while(r>=0&&g.b[r*7+c]!=='.')r--;if(r<0)return;
  const m=g.t?'b':'a';g.b=g.b.slice(0,r*7+c)+m+g.b.slice(r*7+c+1);
  if(c4Win(g.b,r,c,m)){g.win=g.t;point(g.t)}else if(!g.b.includes('.')){g.win=-1;point(null)}else g.t=1-g.t;commit()}
function c4New(){const g=S.c4;g.st=1-g.st;Object.assign(g,{b:'.'.repeat(42),t:g.st,win:null});commit()}
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,'');
function dgGuess(t){const g=S.dg,gs=1-g.d;if(g.solved||!canAct(gs))return;t=t.trim().slice(0,40);if(!t)return;
  g.gs=g.gs.concat([t]).slice(-6);if(norm(t)===norm(g.word)){g.solved=true;point(gs)}commit()}
function dgNext(){if(!linked)return;const g=S.dg;let w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)]}while(w===g.word);Object.assign(g,{d:1-g.d,word:w,solved:false,gs:[],clr:g.clr+1});commit()}
function dgClear(){if(!canAct(S.dg.d))return;S.dg.clr++;commit()}
function totPick(k){const g=S.tot,s=mySeatN;if(!linked||g.p[s]!==null)return;
  g.p[s]=k;if(g.p[0]!==null&&g.p[1]!==null){g.n++;if(g.p[0]===g.p[1])g.m++}commit()}
function totNext(){if(!linked)return;const g=S.tot;g.i=(g.i+1)%TOT.length;g.p=[null,null];commit()}
function tdDraw(k){const g=S.td;if(!canAct(g.t))return;const A=k==='t'?TRUTH:DARE;let c;do{c=Math.floor(Math.random()*A.length)}while(A.length>1&&g.k===k&&c===g.c);g.k=k;g.c=c;commit()}
function tdNext(){if(!linked)return;const g=S.td;g.t=1-g.t;g.k='';g.c=-1;commit()}
function open(gm){if(!linked)return;S.game=gm;commit()}

// ---- drawing ----
let pen=PENS[0],cv=null,cx=null,shownClr=-1,buf=[],last=null,drawing=false;
function setupCanvas(){cv=$('#cv');if(!cv)return;cx=cv.getContext('2d');const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
  cv.width=r.width*d;cv.height=r.height*d;cx.lineCap=cx.lineJoin='round';shownClr=S.dg.clr;
  const P=e=>{const b=cv.getBoundingClientRect();return [+((e.clientX-b.left)/b.width).toFixed(3),+((e.clientY-b.top)/b.height).toFixed(3)]};
  cv.onpointerdown=e=>{if(!canAct(S.dg.d)||S.dg.solved)return;drawing=true;cv.setPointerCapture(e.pointerId);last=P(e);buf=[last]};
  cv.onpointermove=e=>{if(!drawing)return;const p=P(e);stroke([last,p],pen);last=p;buf.push(p);if(buf.length>=60)flush()};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false;flush()};
}
function stroke(pts,c){if(!cx||pts.length<2)return;const W=cv.width,H=cv.height;cx.strokeStyle=c;cx.lineWidth=(c==='#ffffff'?18:5)*(W/400);
  cx.beginPath();cx.moveTo(pts[0][0]*W,pts[0][1]*H);pts.slice(1).forEach(p=>cx.lineTo(p[0]*W,p[1]*H));cx.stroke()}
function flush(){if(buf.length>1)send({t:'k',c:pen,r2:S.dg.clr,p:buf});buf=last?[last]:[]}
setInterval(()=>{if(drawing&&buf.length>1)flush()},60);

// ---- hearts ----
const HEART='<svg viewBox="0 0 24 22"><path d="M12 21C5 15.5 1 12 1 7a5.5 5.5 0 0 1 11-1 5.5 5.5 0 0 1 11 1c0 5-4 8.5-11 14z" fill="#ff6b6b"/></svg>';
function fly(c){const d=document.createElement('div');d.className='fly';d.innerHTML=HEART.replace('#ff6b6b',c||'#ff6b6b');d.style.left=(15+Math.random()*70)+'vw';document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function sendHeart(){const c=mySeatN?'#6c7cff':'#ff6b6b';fly(c);send({t:'h',c:mySeatN})}

// ---- connecting: both phones talk through public relay servers (works on campus Wi-Fi and mobile data) ----
const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');
const link=()=>location.origin+location.pathname+'#'+code;
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const ME=Math.random().toString(36).slice(2,10);
let clients=[],base='',mid=0,seen=new Set(),lastPeer=0,beat=null,watch=null,startedAt=0;
const up=()=>clients.some(c=>c.connected);
function pub(sub,obj,retain){const t=JSON.stringify(obj);clients.forEach(c=>{if(c.connected)try{c.publish(base+'/'+sub,t,{qos:0,retain:!!retain})}catch(e){}})}
function send(m){m.n=myName;m.f=ME;m.r=role;m.id=ME+'.'+(++mid);pub('m',m)}
function shareState(){send({t:'s',s:S});pub('s',{t:'s',s:S,f:ME,r:role,id:ME+'.'+(++mid),n:myName},true)}
function onMsg(raw,ret){let m;try{m=JSON.parse(raw.toString())}catch(e){return}
  if(!m||typeof m!=='object'||m.f===ME||typeof m.id!=='string'||seen.has(m.id))return;
  seen.add(m.id);if(seen.size>800)seen=new Set([...seen].slice(-400));
  if(m.r===role)return; // someone else in my seat: ignore
  if(ret){const d=m.s;if(m.t==='s'&&d&&typeof d==='object'&&typeof d.v==='number'&&d.v>S.v){S=Object.assign(fresh(),d);save();render()}return}
  lastPeer=Date.now();
  if(typeof m.n==='string'&&m.n&&m.n.slice(0,20)!==theirName){theirName=m.n.slice(0,20);render()}
  if(!linked)setLinked(true);
  if(m.t==='s'){const d=m.s;if(d&&typeof d==='object'&&typeof d.v==='number'&&(d.v>S.v||(d.v===S.v&&role==='guest'))){S=Object.assign(fresh(),d);save();render()}return}
  if(m.t==='k'){if(S.game!=='dg'||m.r2!==S.dg.clr||!Array.isArray(m.p))return;stroke(m.p.filter(q=>Array.isArray(q)&&q.length===2&&q.every(n=>typeof n==='number')),PENS.includes(m.c)?m.c:PENS[0]);return}
  if(m.t==='ph'){MOD.pb.got(m);return}
  if(m.t==='vf'){if(S.game==='pb')gotFrame(m);return}
  if(m.t==='pbr'){partnerCamAt=Date.now();if(S.game==='pb'&&!MOD.pb.running)MOD.pb.update();return}
  if(m.t==='whr'){MOD.wh.got(m);return}
  if(m.t==='h')fly(m.c===1?'#6c7cff':'#ff6b6b')}
function setLinked(v){if(linked===v)return;linked=v;if(v){lobbyMsg='';shareState()}status();render()}
function start(r,c){
  role=r;mySeatN=r==='host'?0:1;code=c;if(r==='host')LS.set('lw-host',code);loadS();history.replaceState(null,'','#'+code);
  base='longway-v2/'+code.toLowerCase();startedAt=Date.now();
  clients=BROKERS.map(u=>{const cl=mqtt.connect(u,{clientId:'lw_'+ME+'_'+Math.random().toString(36).slice(2,6),connectTimeout:9000,reconnectPeriod:3000,keepalive:30,clean:true});
    cl.on('connect',()=>{cl.subscribe([base+'/m',base+'/s']);send({t:'p'});status();render()});
    cl.on('message',(t,p,pk)=>onMsg(p,!!(pk&&pk.retain)));cl.on('error',()=>{});return cl});
  beat=setInterval(()=>{if(up())send({t:'p'})},2000);
  watch=setInterval(()=>{if(linked&&Date.now()-lastPeer>8000)setLinked(false);
    if(!up()&&Date.now()-startedAt>12000&&!lobbyMsg){lobbyMsg='Can’t reach the game servers from this network. Try switching Wi-Fi or mobile data, then reload.';render()}
    if(up()&&lobbyMsg.startsWith('Can’t reach')){lobbyMsg='';render()}},1000);
  status();render();
}
function host(c){start('host',c)}
function join(c){start('guest',c)}

const DICE=['AAEEGN','ABBJOO','ACHOPS','AFFKPS','AOOTTW','CIMOTU','DEILRX','DELRVY','DISTTY','EEGHNW','EEINSU','EHRTVW','EIOSST','ELRTTY','HIMNQU','HLNNRZ'];
const WPTS=n=>n<3?0:n===3?100:n===4?400:n===5?800:n===6?1400:n===7?1800:2200;
let DICT=null,dictLoading=false;
function loadDict(){if(DICT||dictLoading)return;dictLoading=true;
  fetch('https://cdn.jsdelivr.net/npm/an-array-of-english-words@2.0.0/index.json').then(r=>r.json()).then(a=>{DICT=new Set(a.filter(w=>w.length>=3&&w.length<=16&&/^[a-z]+$/.test(w)));MOD.wh.update()}).catch(()=>{MOD.wh.err='Couldn’t load the word list. Retrying…';MOD.wh.update();setTimeout(()=>{dictLoading=false;MOD.wh.err='';if(S.game==='wh')loadDict()},5000)})}
MOD.wh={el:null,round:0,endAt:0,found:[],score:0,res:{},path:[],sent:0,err:'',
  build(){const el=mk('div','wh');el.innerHTML=`<div class="whtop"><div class="whscore"><span id="whs">0</span><small>points</small></div><div class="whtime" id="wht">1:20</div><div class="whscore"><span id="whn">0</span><small>words</small></div></div>
    <div class="whword" id="whw">&nbsp;</div><div class="whgrid" id="whg"></div><div id="whmsg" class="note"></div><div id="whres"></div><div class="row"><button class="btn" id="whgo">Start round</button></div>`;
    this.el=el;const g=el.querySelector('#whg');
    const tileAt=(x,y)=>{const t=document.elementFromPoint(x,y);if(!t||!t.dataset||t.dataset.w==null)return -1;const r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;return Math.hypot(x-cx,y-cy)<r.width*0.42?+t.dataset.w:-1};
    g.onpointerdown=e=>{if(!this.live())return;e.preventDefault();g.setPointerCapture(e.pointerId);this.path=[];this.add(tileAt(e.clientX,e.clientY))};
    g.onpointermove=e=>{if(!this.path.length)return;this.add(tileAt(e.clientX,e.clientY))};
    g.onpointerup=g.onpointercancel=()=>{this.submit()};
    el.querySelector('#whgo').onclick=()=>{if(!linked||!DICT)return;let b='';const d=DICE.slice().sort(()=>Math.random()-.5);d.forEach(x=>b+=x[Math.floor(Math.random()*6)]);S.wh={r:(S.wh.r||0)+1,b,dur:80,done:S.wh.done||0};commit()};
    return el},
  live(){return this.round===S.wh.r&&Date.now()<this.endAt},
  word(p){return p.map(i=>S.wh.b[i]==='Q'?'qu':S.wh.b[i].toLowerCase()).join('')},
  add(i){if(i<0)return;const p=this.path;if(p[p.length-2]===i){p.pop();this.paint();return}if(p.includes(i))return;
    if(p.length){const a=p[p.length-1];if(Math.abs(a%4-i%4)>1||Math.abs((a>>2)-(i>>2))>1)return}p.push(i);this.paint()},
  submit(){const w=this.word(this.path);let st='';if(this.path.length&&this.live()){if(w.length<3)st='';else if(this.found.includes(w))st='dup';else if(DICT&&DICT.has(w)){this.found.push(w);this.score+=WPTS(w.length);st='ok'}else st='bad'}
    const ww=this.el.querySelector('#whw');ww.className='whword '+st;ww.textContent=st==='ok'?`${w.toUpperCase()} +${WPTS(w.length)}`:st==='dup'?'Already found':w?w.toUpperCase():' ';
    this.path=[];this.paint();setTimeout(()=>{if(!this.path.length){ww.className='whword';ww.innerHTML='&nbsp;'}},900)},
  paint(){const el=this.el;el.querySelector('#whs').textContent=this.score;el.querySelector('#whn').textContent=this.found.length;
    el.querySelectorAll('[data-w]').forEach(t=>t.classList.toggle('on',this.path.includes(+t.dataset.w)));
    if(this.path.length){const ww=el.querySelector('#whw');ww.className='whword';ww.textContent=this.word(this.path).toUpperCase()}},
  tick(){const left=Math.max(0,this.endAt-Date.now()),el=this.el;if(!el)return;
    const sec=Math.ceil(left/1000);el.querySelector('#wht').textContent=this.round?`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`:'1:20';
    if(this.round&&left<=0&&this.sent!==this.round){this.sent=this.round;this.path=[];this.res[mySeatN]={score:this.score,words:this.found.slice()};send({t:'whr',r:this.round,score:this.score,words:this.found.slice(0,80)});this.update()}
    if(this.round&&left<=0)this.finish()},
  got(m){if(m.r!==S.wh.r||typeof m.score!=='number')return;this.res[1-mySeatN]={score:Math.max(0,Math.min(99999,m.score|0)),words:Array.isArray(m.words)?m.words.filter(w=>typeof w==='string').map(w=>w.slice(0,16)).slice(0,80):[]};this.finish();this.update()},
  finish(){const a=this.res[0],b=this.res[1];if(role!=='host'||!a||!b||S.wh.done===S.wh.r||this.sent!==this.round)return;S.wh.done=S.wh.r;point(a.score===b.score?null:a.score>b.score?0:1);commit()},
  update(){const el=this.el;if(!el)return;loadDict();
    if(S.wh.r&&S.wh.r!==this.round){this.round=S.wh.r;this.endAt=Date.now()+(S.wh.dur||80)*1000;this.found=[];this.score=0;this.res={};this.path=[]}
    const g=el.querySelector('#whg');if(g.dataset.b!==(S.wh.b||'')){g.dataset.b=S.wh.b||'';g.innerHTML=[...(S.wh.b||'                ')].map((c,i)=>`<div class="wt" data-w="${i}">${c==='Q'?'Qu':esc(c.trim())}</div>`).join('')}
    const live=this.live(),over=this.round&&!live;
    el.querySelector('#whgo').style.display=live?'none':'';el.querySelector('#whgo').textContent=this.round?'New round':'Start round';
    el.querySelector('#whg').classList.toggle('dim',!live);
    el.querySelector('#whmsg').textContent=this.err||(!DICT?'Loading the dictionary…':live?'Drag across touching letters to make words (3+ letters).':!this.round?'You both get the same board and 80 seconds. Most points wins.':'');
    const R=el.querySelector('#whres');
    if(over){const mine=this.res[mySeatN],th=this.res[1-mySeatN];
      if(!th)R.innerHTML=`<p class="turn">Time! Waiting for ${esc(theirName||'your partner')}’s score…</p>`;
      else{const w=mine.score===th.score?'It’s a tie!':mine.score>th.score?'You win!':`${esc(theirName||'Partner')} wins!`;
        const col=(i,r)=>`<div class="whcol"><b class="p${i+1}c">${esc(name(i))}: ${r.score}</b><div>${r.words.map(x=>`<span>${esc(x)}</span>`).join('')||'<i>no words</i>'}</div></div>`;
        R.innerHTML=`<p class="turn">${w}</p><div class="whcols">${col(0,this.res[0])}${col(1,this.res[1])}</div>`}}
    else R.innerHTML='';
    this.paint()},
  mount(st){if(!this.el)this.build();st.appendChild(this.el);this.update()}};

const PW=1000,PH=500,BR=14,POCK=[[0,0,30],[500,-4,26],[1000,0,30],[0,500,30],[500,504,26],[1000,500,30]];
const BCOL=['#fffdf5','#f5c518','#1f4bd8','#d62828','#6a2c91','#f77f00','#2a9d4b','#7b2d26','#111111','#f5c518','#1f4bd8','#d62828','#6a2c91','#f77f00','#2a9d4b','#7b2d26'];
function rack(){const b=[[250,250,1]];const order=[1,9,2,10,8,3,11,7,14,4,5,13,15,6,12];let k=0;
  for(let c=0;c<5;c++)for(let r=0;r<=c;r++){const n=order[k++];b[n]=[730+c*24.5,250+(r-c/2)*28.6,1]}return b}

function simulate(b0,vx,vy,onFrame){const b=b0.map(x=>[x[0],x[1],x[2]]),v=b.map(()=>[0,0]);v[0]=[vx,vy];

        for(const p of POCK){const dx=b[i][0]-p[0],dy=b[i][1]-p[1];if(dx*dx+dy*dy<p[2]*p[2]){b[i][2]=0;v[i]=[0,0];ev.pot.push(i);break}}
        if(!b[i][2])continue;

      for(let i=0;i<16;i++){if(!b[i][2])continue;for(let j=i+1;j<16;j++){if(!b[j][2])continue;
        const dx=b[j][0]-b[i][0],dy=b[j][1]-b[i][1],d2=dx*dx+dy*dy;if(d2>=4*BR*BR)continue;

  else{const balls=pot.filter(i=>i!==0);
    if(!myG&&balls.length){const gg=grpOf(balls[0]);g[me]=gg;g[1-me]=gg==='solid'?'stripe':'solid'}

    else if(!r.ev.first){msg='missed every ball.'}
    else if(own){keep=true;msg=`potted ${own===1?'a ball':own+' balls'}. Shoot again!`}

function status(){$('#cdot').className='dot'+(linked?' on':'');
  $('#ctext').textContent=!role?'Not in a game':linked?(theirName||'Partner')+' is here':!up()?'Connecting…':'Waiting for partner'}
addEventListener('resize',()=>{if(S.game==='dg'){cv=null;render()}if(S.game==='pool')MOD.pool.draw()});

// arriving from a partner's link (#CODE): join straight away, no sign-in
const fromLink=location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g,'');
if(typeof mqtt==='undefined'){lobbyMsg='Couldn’t load the connection library. Check your internet and reload.';render();status()}
else if(fromLink&&fromLink===LS.get('lw-host'))host(fromLink);
else if(fromLink)join(fromLink);
else{render();status()}
status();
}

</script>
